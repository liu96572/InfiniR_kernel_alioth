name: Build Kernel - Fixed Package

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Fixed
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Fix KernelSU dependency
      run: |
        echo "修复KernelSU依赖..."
        sed -i '/kernelsu/d' drivers/Kconfig
        echo "✅ KernelSU引用已移除"

    - name: Install compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        mkdir -p out
        make O=out ARCH=arm64 alioth_defconfig
        echo "CONFIG_ZSTD_COMPRESS=y" >> out/.config
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> out/.config
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> out/.config
        echo "CONFIG_SWAP=y" >> out/.config
        make O=out ARCH=arm64 olddefconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 内核编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
        else
          echo "❌ 编译失败"
          exit 1
        fi

    - name: Create manual package
      if: success()
      run: |
        echo "创建手动刷机包..."
        
        # 手动创建AnyKernel3结构
        mkdir -p ak3_package/META-INF/com/google/android
        mkdir -p ak3_package/tools
        
        # 复制内核文件
        cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
        
        # 创建update-binary
        cat > ak3_package/META-INF/com/google/android/update-binary << 'EOF'
#!/sbin/sh
echo "InfiniR Kernel Flash"
echo "Mounting partitions..."
mount /system 2>/dev/null
mount /vendor 2>/dev/null

echo "Extracting kernel..."
cd /tmp
unzip -o "$3" Image.gz-dtb

echo "Flashing kernel to boot partition..."
dd if=/tmp/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot

echo "Cleaning up..."
umount /system 2>/dev/null
umount /vendor 2>/dev/null
echo "Flash complete! Reboot your device."
EOF

        # 创建updater-script
        cat > ak3_package/META-INF/com/google/android/updater-script << 'EOF'
ui_print("InfiniR Fixed Kernel");
ui_print("With ZSTD Compression");
ui_print("Flashing kernel...");
show_progress(0.500000, 0);
package_extract_file("Image.gz-dtb", "/tmp/Image.gz-dtb");
run_program("/sbin/dd", "if=/tmp/Image.gz-dtb", "of=/dev/block/bootdevice/by-name/boot");
show_progress(0.100000, 0);
ui_print("Flash complete!");
EOF

        # 设置权限
        chmod 755 ak3_package/META-INF/com/google/android/update-binary
        
        # 创建ZIP包
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        
        echo "✅ 刷机包创建完成"
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fixed-kernel
        path: "*.zip"
        retention-days: 7
