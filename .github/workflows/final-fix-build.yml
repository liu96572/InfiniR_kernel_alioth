name: Build Kernel - Final Fix

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Final_Fix
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Fix KernelSU reference
      run: |
        sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# source "drivers\/kernelsu\/Kconfig"/' drivers/Kconfig 2>/dev/null || true

    - name: Disable all problematic drivers
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "禁用所有有问题的驱动..."
        mkdir -p out
        
        # 使用现有配置
        cp arch/arm64/configs/alioth_defconfig out/.config
        
        # 禁用所有BQ2597X相关驱动
        echo "# CONFIG_BQ2597X_CHARGE_PUMP is not set" >> out/.config
        echo "# CONFIG_BQ2597X_CHARGE_PUMP_STANDALONE is not set" >> out/.config
        echo "# CONFIG_BQ2597X_CHARGE_PUMP_STANDALONE_MUNCH is not set" >> out/.config
        echo "# CONFIG_BQ_PUMP_WIRELESS_CHARGE is not set" >> out/.config
        echo "# CONFIG_DUAL_BQ2597X is not set" >> out/.config
        
        # 禁用可能相关的其他驱动
        echo "# CONFIG_CHARGER_LN8000 is not set" >> out/.config
        echo "# CONFIG_CHARGER_LN8000_PSYCHE is not set" >> out/.config
        
        # 禁用所有可能包含浮点运算的驱动
        echo "# CONFIG_SENSORS_QPNP_ADC_VOLTAGE is not set" >> out/.config
        
        echo "应用配置..."
        make O=out ARCH=arm64 olddefconfig > /dev/null 2>&1
        
        echo "验证驱动禁用状态..."
        echo "BQ2597X相关:"
        grep -i "bq2597" out/.config || echo "✅ 所有BQ2597X驱动已禁用"
        echo "LN8000相关:"
        grep -i "ln8000" out/.config || echo "✅ 所有LN8000驱动已禁用"

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "开始最终编译..."
        echo "预计时间：60-90分钟"
        
        # 详细编译以便调试
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "文件大小验证通过"
        else
          echo "编译状态检查..."
          if [ -f "out/vmlinux" ]; then
            echo "⚠️ 生成了vmlinux但未生成最终镜像"
            ls -lh out/vmlinux
          else
            echo "❌ 编译完全失败"
            echo "最后编译的目录:"
            find out/ -name "*.o" -type f -exec ls -lt {} + 2>/dev/null | head -3
          fi
        fi

    - name: Create package
      if: success()
      run: |
        mkdir -p ak3_package
        cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
        
        cat > ak3_package/anykernel.sh << 'EOF'
        #!/system/bin/sh
        echo "Flashing InfiniR Final Kernel..."
        echo "BQ2597X drivers disabled for compatibility"
        dd if=/tmp/anykernel/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot
        echo "Flash complete! Reboot to apply."
        EOF
        
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        
        echo "✅ 刷机包创建完成"
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: final-fixed-kernel
        path: "*.zip"
