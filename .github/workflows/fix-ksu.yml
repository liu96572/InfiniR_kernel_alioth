name: Build Kernel - Fix KSU Dependency

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_NoKSU
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Install compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Fix KernelSU dependency
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "步骤1: 修复KernelSU依赖..."
        # 检查并修复drivers/Kconfig文件
        if grep -q "kernelsu" drivers/Kconfig; then
          echo "发现KernelSU引用，创建修复..."
          # 备份原文件
          cp drivers/Kconfig drivers/Kconfig.backup
          # 移除KernelSU相关行
          grep -v "kernelsu" drivers/Kconfig > drivers/Kconfig.fixed
          mv drivers/Kconfig.fixed drivers/Kconfig
          echo "✅ 已移除KernelSU依赖"
        fi
        
        echo "步骤2: 创建输出目录..."
        mkdir -p out

    - name: Configure without KSU
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "步骤3: 手动创建配置..."
        # 使用最简配置开始
        make O=out ARCH=arm64 defconfig
        
        echo "步骤4: 手动设置必要选项..."
        # 直接创建最小可用的.config
        cat > out/.config << 'EOF'
CONFIG_LOCALVERSION="-InfiniR_Fixed"
CONFIG_SYSVIPC=y
CONFIG_POSIX_MQUEUE=y
CONFIG_NO_HZ=y
CONFIG_HIGH_RES_TIMERS=y
CONFIG_PREEMPT=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_LOG_BUF_SHIFT=19
CONFIG_BLK_DEV_INITRD=y
CONFIG_EMBEDDED=y
CONFIG_SLAB=y
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_MODULE_FORCE_UNLOAD=y
CONFIG_PARTITION_ADVANCED=y
CONFIG_ARCH_QCOM=y
CONFIG_ARCH_SDM845=y
CONFIG_ARM64_VA_BITS=48
CONFIG_SCHED_MC=y
CONFIG_NR_CPUS=8
CONFIG_ARMV8_DEPRECATED=y
CONFIG_COMPAT=y
CONFIG_CPU_IDLE=y
CONFIG_ARM_CPUIDLE=y
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_GOV_POWERSAVE=y
CONFIG_CPU_FREQ_GOV_USERSPACE=y
CONFIG_CPU_FREQ_GOV_ONDEMAND=y
CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
CONFIG_CPUFREQ_DT=y
CONFIG_ARM_QCOM_CPUFREQ_HW=y
CONFIG_VFP=y
CONFIG_NEON=y
CONFIG_KERNEL_MODE_NEON=y
CONFIG_PM_WAKELOCKS=y
CONFIG_PM_DEBUG=y
CONFIG_PM_ADVANCED_DEBUG=y
CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
CONFIG_CRYPTO_SHA2_ARM64_CE=y
CONFIG_CRYPTO_AES_ARM64_CE_BLK=y
CONFIG_CRYPTO_CHACHA20_NEON=y
CONFIG_ZSTD_COMPRESS=y
CONFIG_ZSTD_DECOMPRESS=y
CONFIG_ZRAM=y
CONFIG_ZRAM_DEF_COMP_ZSTD=y
CONFIG_SWAP=y
CONFIG_CGROUP_FREEZER=y
EOF

        echo "步骤5: 应用配置..."
        yes "" | make O=out ARCH=arm64 oldconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "开始编译..."
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
        else
          echo "检查编译输出..."
          find out/ -name "vmlinux" -o -name "Image*" | head -10
          exit 1
        fi

    - name: Create package
      if: success()
      run: |
        echo "创建刷机包..."
        wget -q https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
        unzip -q ak3.zip
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3-master/
        
        cd AnyKernel3-master
        zip -r9 "../${KERNEL_NAME}.zip" . -x "*.git*" "*.md"
        cd ..
        
        echo "✅ 刷机包完成: ${KERNEL_NAME}.zip"
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fixed-kernel-noksu
        path: "*.zip"
