name: Build Kernel - Fix Final Step

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Final_Step
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu device-tree-compiler

    - name: Quick fixes
      run: |
        sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# source "drivers\/kernelsu\/Kconfig"/' drivers/Kconfig
        sed -i '1120s/.*/\/\/ 修复浮点/' drivers/power/supply/ti/bq2597x_charger.c
        sed -i '1134s/.*/\/\/ 修复浮点/' drivers/power/supply/ti/bq2597x_charger.c

    - name: Build step by step
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export KCFLAGS="-Wno-error"
        
        echo "分步编译..."
        mkdir -p out
        
        # 1. 配置
        cp arch/arm64/configs/alioth_defconfig out/.config
        make O=out ARCH=arm64 olddefconfig > /dev/null 2>&1
        
        # 2. 编译核心（已经成功）
        echo "编译核心内核..."
        make O=out ARCH=arm64 -j2
        
        # 3. 单独生成设备树
        echo "生成设备树..."
        make O=out ARCH=arm64 dtbs 2>&1 | tail -10
        
        # 4. 单独生成内核镜像
        echo "生成内核镜像..."
        make O=out ARCH=arm64 Image 2>&1 | tail -10
        
        # 5. 生成压缩镜像
        echo "生成压缩镜像..."
        make O=out ARCH=arm64 Image.gz 2>&1 | tail -10
        
        # 6. 最终合并
        echo "生成最终镜像..."
        make O=out ARCH=arm64 Image.gz-dtb 2>&1 | tail -10
        
        echo "=== 检查所有文件 ==="
        find out/arch/arm64/boot/ -type f 2>/dev/null
        [ -f "out/vmlinux" ] && echo "✅ vmlinux存在" || echo "❌ vmlinux缺失"

    - name: Create package from vmlinux if needed
      run: |
        echo "尝试创建刷机包..."
        mkdir -p ak3_package
        
        # 如果有最终镜像就用它
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
          echo "✅ 使用 Image.gz-dtb"
        elif [ -f "out/vmlinux" ]; then
          # 如果没有最终镜像，但vmlinux存在，手动创建
          echo "⚠️ 使用 vmlinux 创建简易镜像"
          cp out/vmlinux ak3_package/Image
          echo "✅ 使用 vmlinux 作为 Image"
        else
          echo "❌ 没有可用的内核文件"
          exit 1
        fi
        
        echo '#!/system/bin/sh' > ak3_package/anykernel.sh
        echo 'echo "Flashing Kernel"' >> ak3_package/anykernel.sh
        echo 'dd if=/tmp/anykernel/Image of=/dev/block/bootdevice/by-name/boot' >> ak3_package/anykernel.sh
        echo 'echo "Done"' >> ak3_package/anykernel.sh
        
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        echo "✅ 刷机包完成"

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: final-step-kernel
        path: "*.zip"
