name: Build Kernel - Final

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Final
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Fix KernelSU dependency
      run: |
        sed -i '/kernelsu/d' drivers/Kconfig

    - name: Install compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        mkdir -p out
        make O=out ARCH=arm64 alioth_defconfig
        echo "CONFIG_ZSTD_COMPRESS=y" >> out/.config
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> out/.config
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> out/.config
        echo "CONFIG_SWAP=y" >> out/.config
        make O=out ARCH=arm64 olddefconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make O=out ARCH=arm64 -j2
        ls -lh out/arch/arm64/boot/Image.gz-dtb

    - name: Create simple package
      if: success()
      run: |
        mkdir -p ak3_package
        cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
        
        # 使用echo创建简单脚本，避免heredoc
        echo '#!/sbin/sh' > ak3_package/update-binary
        echo 'echo "Flashing InfiniR Kernel"' >> ak3_package/update-binary
        echo 'dd if=/tmp/kernel/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot' >> ak3_package/update-binary
        echo 'echo "Flash complete!"' >> ak3_package/update-binary
        
        chmod 755 ak3_package/update-binary
        
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: final-kernel
        path: "*.zip"
