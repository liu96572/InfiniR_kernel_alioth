name: Debug Build Environment

on: 
  workflow_dispatch:  # 只允许手动触发

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout 16.0-alioth branch
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth  # 明确指定你的主分支

    - name: System Information
      run: |
        echo "=== 系统基本信息 ==="
        uname -a
        echo " "
        
        echo "=== Ubuntu 版本 ==="
        lsb_release -a
        echo " "

    - name: Resource Information
      run: |
        echo "=== 磁盘使用情况 ==="
        df -h
        echo " "
        
        echo "=== 内存信息 ==="
        free -h
        echo " "
        
        echo "=== CPU 信息 ==="
        nproc
        echo " "

    - name: Pre-installed Compilers
      run: |
        echo "=== 预安装的编译器 ==="
        echo "GCC: $(which gcc && gcc --version | head -1 || echo '未安装')"
        echo "Clang: $(which clang && clang --version | head -1 || echo '未安装')"
        echo "ARM GCC: $(which aarch64-linux-gnu-gcc && aarch64-linux-gnu-gcc --version | head -1 || echo '未安装')"
        echo " "

    - name: Build Tools Check
      run: |
        echo "=== 编译工具检查 ==="
        echo "make: $(which make && make --version | head -1 || echo '未安装')"
        echo "bc: $(which bc && echo '已安装' || echo '未安装')"
        echo "flex: $(which flex && flex --version | head -1 || echo '未安装')"
        echo "bison: $(which bison && bison --version | head -1 || echo '未安装')"
        echo " "

    - name: Kernel Source Check
      run: |
        echo "=== 内核源码检查 ==="
        echo "当前目录: $(pwd)"
        echo " "
        echo "顶层文件:"
        ls -la | head -15
        echo " "
        echo "=== 关键文件检查 ==="
        [ -f "Makefile" ] && echo "✅ Makefile 存在" || echo "❌ Makefile 缺失"
        [ -f "Kbuild" ] && echo "✅ Kbuild 存在" || echo "❌ Kbuild 缺失"
        [ -d "arch/arm64" ] && echo "✅ arch/arm64 目录存在" || echo "❌ arch/arm64 目录缺失"
        [ -f "arch/arm64/configs/alioth_defconfig" ] && echo "✅ alioth_defconfig 存在" || echo "❌ alioth_defconfig 缺失"
        [ -d "kernel" ] && echo "✅ kernel 目录存在" || echo "❌ kernel 目录缺失"
        echo " "

    - name: Network Test
      run: |
        echo "=== 网络连接测试 ==="
        echo "测试 GitHub: $(curl -s -o /dev/null -w '%{http_code}' https://github.com --connect-timeout 10 || echo '失败')"
        echo "测试 Google: $(curl -s -o /dev/null -w '%{http_code}' https://google.com --connect-timeout 10 || echo '失败')"
        echo " "

    - name: Directory Permissions
      run: |
        echo "=== 目录权限检查 ==="
        echo "当前用户: $(whoami)"
        echo "当前目录权限:"
        ls -la ./
        echo " "
        echo "创建测试目录:"
        mkdir -p test_dir
        echo "测试目录创建结果: $?"
        rm -rf test_dir
        echo " "

    - name: Environment Variables
      run: |
        echo "=== 环境变量 ==="
        echo "PATH: $PATH"
        echo "HOME: $HOME"
        echo "PWD: $PWD"
        echo " "
