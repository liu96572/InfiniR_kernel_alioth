name: Build Kernel - Optimized Speed

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Fast
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 增加到120分钟
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Install optimized environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu ccache

    - name: Fix KernelSU reference
      run: |
        echo "修复KernelSU引用问题..."
        if [ ! -d "drivers/kernelsu" ]; then
          echo "注释KernelSU引用..."
          sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# source "drivers\/kernelsu\/Kconfig"/' drivers/Kconfig
        fi

    - name: Create optimized configuration
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "设置ccache缓存..."
        export CC="ccache aarch64-linux-gnu-gcc"
        export PATH="/usr/lib/ccache:$PATH"
        
        echo "创建输出目录..."
        mkdir -p out
        
        echo "生成最小化配置..."
        # 使用defconfig而不是allyesconfig，更快更小
        make O=out ARCH=arm64 defconfig > /dev/null 2>&1
        
        echo "添加核心功能..."
        # 只添加最必要的功能
        echo "CONFIG_MODULES=y" >> out/.config
        echo "CONFIG_MODULE_UNLOAD=y" >> out/.config
        echo "CONFIG_ZSTD_COMPRESS=y" >> out/.config
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> out/.config
        echo "CONFIG_KERNEL_ZSTD=y" >> out/.config
        echo "CONFIG_SWAP=y" >> out/.config
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_CGROUP_FREEZER=y" >> out/.config
        
        echo "禁用调试功能减少大小..."
        echo "CONFIG_DEBUG_INFO=n" >> out/.config
        echo "CONFIG_DEBUG_KERNEL=n" >> out/.config
        
        echo "应用配置..."
        make O=out ARCH=arm64 olddefconfig

    - name: Build with optimizations
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC="ccache aarch64-linux-gnu-gcc"
        export PATH="/usr/lib/ccache:$PATH"
        
        echo "开始优化编译..."
        echo "编译进度监控..."
        
        # 分阶段编译，显示进度
        echo "阶段1: 编译核心..."
        make O=out ARCH=arm64 -j2 2>&1 | grep -E 'CC|LD|AR' | tail -1 &
        COMPILE_PID=$!
        
        # 进度监控
        while kill -0 $COMPILE_PID 2>/dev/null; do
          echo "$(date): 编译进行中..."
          sleep 60
        done
        
        wait $COMPILE_PID
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 内核编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "编译时间: 约$((SECONDS/60))分钟"
        else
          echo "编译状态检查..."
          find out/ -name "vmlinux" -o -name "Image*" 2>/dev/null | head -5
          echo "如果超时，请检查配置是否过于复杂"
        fi

    - name: Create minimal package
      if: success()
      run: |
        echo "创建刷机包..."
        mkdir -p ak3_package
        cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
        
        cat > ak3_package/anykernel.sh << 'EOF'
        #!/system/bin/sh
        echo "Flashing Optimized Kernel..."
        dd if=/tmp/anykernel/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot
        echo "Flash complete!"
        EOF
        
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        
        echo "✅ 刷机包完成"
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fast-kernel
        path: "*.zip"
