name: Build Kernel - Disable Werror

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_No_Werror
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu device-tree-compiler

    - name: Fix all compile issues
      run: |
        echo "修复所有编译问题..."
        
        # 修复KernelSU引用
        sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# source "drivers\/kernelsu\/Kconfig"/' drivers/Kconfig 2>/dev/null || true
        
        # 修复bq2597x浮点问题
        sed -i '1120s/.*/\/\/ *result = t; \/\/* 注释浮点运算/' drivers/power/supply/ti/bq2597x_charger.c
        sed -i '1134s/.*/\/\/ *result = (int)(t * sc8551_adc_lsb[channel]); \/\/* 注释浮点运算/' drivers/power/supply/ti/bq2597x_charger.c
        
        # 修复音频驱动格式错误
        sed -i '715s/%d/%lu/' techpack/audio/asoc/codecs/bolero/tx-macro.c 2>/dev/null || echo "无法修复音频驱动"

    - name: Build with KCFLAGS override
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # 禁用Werror，允许警告但不中断编译
        export KCFLAGS="-Wno-error -Wno-format -Wno-array-bounds -Wno-format-extra-args"
        
        echo "开始编译（禁用Werror）..."
        mkdir -p out
        
        # 使用现有配置
        cp arch/arm64/configs/alioth_defconfig out/.config
        
        # 应用配置
        make O=out ARCH=arm64 olddefconfig > /dev/null 2>&1
        
        echo "编译内核..."
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 内核编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "文件大小: $(stat -c%s out/arch/arm64/boot/Image.gz-dtb) 字节"
        else
          echo "检查生成的文件..."
          find out/arch/arm64/boot/ -name "Image*" -type f 2>/dev/null
          [ -f "out/vmlinux" ] && echo "✅ vmlinux存在" || echo "❌ vmlinux缺失"
        fi

    - name: Create package
      if: success()
      run: |
        echo "创建刷机包..."
        mkdir -p ak3_package
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
          echo "✅ 使用Image.gz-dtb"
        else
          echo "❌ 找不到内核镜像"
          exit 1
        fi
        
        cat > ak3_package/anykernel.sh << 'EOF'
        #!/system/bin/sh
        echo "Flashing InfiniR Kernel (No Werror)..."
        echo "Format warnings disabled for compatibility"
        dd if=/tmp/anykernel/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot
        echo "Flash complete!"
        EOF
        
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        
        echo "✅ 刷机包完成"
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: no-werror-kernel
        path: "*.zip"
