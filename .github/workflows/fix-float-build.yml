name: Build Kernel - Fix Float Error

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Fixed_Float
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Fix KernelSU Kconfig
      run: |
        sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# source "drivers\/kernelsu\/Kconfig"/' drivers/Kconfig 2>/dev/null || true

    - name: Build with float fix
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "修复浮点编译问题..."
        mkdir -p out
        
        # 使用现有配置
        cp arch/arm64/configs/alioth_defconfig out/.config
        
        # 禁用有问题的驱动来绕过编译错误
        echo "CONFIG_BQ2597X_CHARGE_PUMP=n" >> out/.config
        
        # 应用配置
        make O=out ARCH=arm64 olddefconfig > /dev/null 2>&1
        
        echo "开始编译（已禁用问题驱动）..."
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
        else
          echo "编译状态检查..."
          find out/ -name "vmlinux" -o -name "Image*" 2>/dev/null | head -5
        fi

    - name: Create package
      if: success()
      run: |
        mkdir -p ak3_package
        cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
        
        cat > ak3_package/anykernel.sh << 'EOF'
        #!/system/bin/sh
        echo "Flashing InfiniR Kernel (Fixed Float)..."
        dd if=/tmp/anykernel/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot
        echo "Flash complete!"
        EOF
        
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        
        echo "✅ 刷机包完成"

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fixed-float-kernel
        path: "*.zip"
