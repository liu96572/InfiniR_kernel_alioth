name: Build Kernel - Defconfig Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Setup
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Create fixed defconfig
      run: |
        # 基于原defconfig创建修复版
        cp arch/arm64/configs/alioth_defconfig arch/arm64/configs/alioth_fixed_defconfig
        
        # 禁用所有有问题的驱动
        sed -i '/CONFIG_SND_SOC_SWR_MSTR_CTRL/d' arch/arm64/configs/alioth_fixed_defconfig
        sed -i '/CONFIG_BQ2597X_CHARGER/d' arch/arm64/configs/alioth_fixed_defconfig
        sed -i '/CONFIG_DRM_MSM_DSI/d' arch/arm64/configs/alioth_fixed_defconfig
        sed -i '/CONFIG_TECHPACK_AUDIO/d' arch/arm64/configs/alioth_fixed_defconfig
        sed -i '/CONFIG_TECHPACK_DISPLAY/d' arch/arm64/configs/alioth_fixed_defconfig
        
        # 添加必要功能
        echo "CONFIG_ZSTD_COMPRESS=y" >> arch/arm64/configs/alioth_fixed_defconfig
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> arch/arm64/configs/alioth_fixed_defconfig
        echo "CONFIG_ZRAM=y" >> arch/arm64/configs/alioth_fixed_defconfig
        echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> arch/arm64/configs/alioth_fixed_defconfig
        echo "CONFIG_SWAP=y" >> arch/arm64/configs/alioth_fixed_defconfig
        
        echo "✅ 修复版defconfig创建完成"

    - name: Build with fixed config
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        mkdir -p out
        
        # 使用修复版defconfig
        make O=out ARCH=arm64 alioth_fixed_defconfig
        
        # 验证配置
        echo "检查问题驱动是否已禁用:"
        grep -E "SND_SOC_SWR_MSTR_CTRL|BQ2597X_CHARGER|DRM_MSM_DSI" out/.config || echo "✅ 问题驱动已禁用"
        
        echo "检查ZSTD是否已启用:"
        grep -E "ZSTD_COMPRESS|ZSTD_DECOMPRESS|ZRAM" out/.config
        
        # 开始编译
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "文件大小: $(ls -lh out/arch/arm64/boot/Image.gz-dtb | awk '{print $5}')"
        else
          echo "❌ 编译失败"
          exit 1
        fi

    - name: Create flash package
      if: success()
      run: |
        mkdir -p ak3_package
        cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
        
        # 创建简单刷机脚本
        echo '#!/sbin/sh' > ak3_package/anykernel.sh
        echo 'dd if=/tmp/anykernel/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot' >> ak3_package/anykernel.sh
        chmod +x ak3_package/anykernel.sh
        
        cd ak3_package
        zip -r9 ../InfiniR_Fixed_Kernel.zip .
        cd ..
        
        echo "✅ 刷机包创建完成"
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fixed-kernel
        path: "*.zip"
