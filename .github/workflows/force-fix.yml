name: Build Kernel - Force Fix KSU

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_ForceFixed
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Force fix KernelSU dependency
      run: |
        echo "强制修复KernelSU依赖..."
        
        # 检查drivers/Kconfig文件
        echo "修复前drivers/Kconfig内容（相关部分）:"
        grep -A5 -B5 "kernelsu" drivers/Kconfig || echo "未找到kernelsu引用"
        
        # 强制移除KernelSU相关行
        sed -i '/kernelsu/d' drivers/Kconfig
        echo "✅ 已移除所有kernelsu引用"
        
        # 验证修复
        echo "修复后检查:"
        grep -n "kernelsu" drivers/Kconfig && echo "❌ 仍有残留" || echo "✅ 清理完成"
        
        # 创建空的KernelSU目录避免错误
        mkdir -p drivers/kernelsu
        touch drivers/kernelsu/Kconfig
        echo "# Empty Kconfig for KernelSU" > drivers/kernelsu/Kconfig
        echo "✅ 创建空的KernelSU Kconfig文件"

    - name: Install compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "创建输出目录..."
        mkdir -p out
        
        echo "复制原始配置..."
        # 直接使用原始defconfig，但现在依赖已修复
        cp arch/arm64/configs/alioth_defconfig out/.config
        
        echo "移除有问题的KernelSU配置..."
        # 从配置中移除KernelSU相关设置
        sed -i '/CONFIG_KPROFILES/d' out/.config
        sed -i '/CONFIG_AUTO_KPROFILES/d' out/.config
        
        echo "添加必要功能..."
        echo "CONFIG_ZSTD_COMPRESS=y" >> out/.config
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> out/.config
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> out/.config
        echo "CONFIG_SWAP=y" >> out/.config
        
        echo "应用配置..."
        make O=out ARCH=arm64 olddefconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "开始编译..."
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "编译完成时间: $(date)"
        else
          echo "❌ 编译失败，检查错误..."
          # 显示编译错误
          find out/ -name "*.o" | head -5
          exit 1
        fi

    - name: Create package
      if: success()
      run: |
        echo "创建刷机包..."
        # 使用最小化AnyKernel3
        git clone -q --depth=1 https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        
        # 简化刷机脚本
        cat > AnyKernel3/anykernel.sh << 'EOF'
        #!/system/bin/sh
        . tools/ak3-core.sh
        dump_boot
        write_boot
        EOF
        
        cd AnyKernel3
        zip -r9 "../${KERNEL_NAME}.zip" . -x "*.git*" "README.md"
        cd ..
        
        echo "✅ 刷机包创建完成: ${KERNEL_NAME}.zip"
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: force-fixed-kernel
        path: "*.zip"
