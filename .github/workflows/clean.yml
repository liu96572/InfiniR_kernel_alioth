name: Build Kernel - Complete Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Setup environment
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Fix KernelSU
      run: sed -i '/kernelsu/d' drivers/Kconfig

    - name: Remove all problematic drivers
      run: |
        # 删除所有有问题的驱动目录
        rm -rf techpack/audio techpack/display
        rm -rf drivers/input/touchscreen/focaltech_spi
        rm -rf drivers/power/supply/ti
        
        # 创建空目录避免编译错误
        mkdir -p techpack/audio techpack/display
        mkdir -p drivers/input/touchscreen/focaltech_spi
        mkdir -p drivers/power/supply/ti
        
        # 创建空的Makefile和Kconfig
        echo "# Disabled" > techpack/audio/Makefile
        echo "# Disabled" > techpack/display/Makefile
        echo "# Disabled" > drivers/input/touchscreen/focaltech_spi/Makefile
        echo "# Disabled" > drivers/power/supply/ti/Makefile
        
        echo "# Disabled" > techpack/audio/Kconfig
        echo "# Disabled" > techpack/display/Kconfig

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # 清理并重新开始
        make mrproper
        mkdir -p out
        
        # 使用设备配置
        make O=out ARCH=arm64 alioth_defconfig
        
        # 启用核心功能
        echo "CONFIG_ZSTD_COMPRESS=y" >> out/.config
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> out/.config
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_SWAP=y" >> out/.config
        
        # 强制禁用所有问题模块
        echo "CONFIG_SND_SOC=n" >> out/.config
        echo "CONFIG_TECHPACK_AUDIO=n" >> out/.config
        echo "CONFIG_TECHPACK_DISPLAY=n" >> out/.config
        echo "CONFIG_TOUCHSCREEN_FTS=n" >> out/.config
        echo "CONFIG_POWER_SUPPLY=n" >> out/.config
        echo "CONFIG_INPUT_TOUCHSCREEN=n" >> out/.config
        
        # 应用配置
        make O=out ARCH=arm64 olddefconfig
        
        echo "配置完成，检查禁用状态..."
        grep -E "CONFIG_(SND_SOC|TECHPACK|TOUCHSCREEN|POWER_SUPPLY)=n" out/.config

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "开始最终编译..."
        make O=out ARCH=arm64 -j2
        
        # 检查结果
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "文件大小: $(ls -lh out/arch/arm64/boot/Image.gz-dtb | awk '{print $5}')"
        else
          echo "❌ 编译失败，检查问题..."
          find out/ -name "*.o" | head -5
          exit 1
        fi

    - name: Create package
      if: success()
      run: |
        mkdir -p pkg
        cp out/arch/arm64/boot/Image.gz-dtb pkg/
        cd pkg
        zip ../kernel.zip Image.gz-dtb
        echo "✅ 刷机包创建完成"
        ls -lh ../*.zip

    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: complete-kernel
        path: "*.zip"
