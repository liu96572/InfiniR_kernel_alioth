name: Build Kernel - Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Setup
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Fix KernelSU
      run: sed -i '/kernelsu/d' drivers/Kconfig

    - name: Configure
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        mkdir -p out
        make O=out ARCH=arm64 alioth_defconfig
        
        # 启用必要功能
        echo "CONFIG_ZSTD_COMPRESS=y" >> out/.config
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> out/.config
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_SWAP=y" >> out/.config
        
        # 禁用所有有问题的驱动
        echo "CONFIG_SND_SOC_SWR_MSTR_CTRL=n" >> out/.config
        echo "CONFIG_BQ2597X_CHARGER=n" >> out/.config
        echo "CONFIG_DRM_MSM_DSI=n" >> out/.config
        echo "CONFIG_TECHPACK_DISPLAY=n" >> out/.config
        echo "CONFIG_TECHPACK_AUDIO=n" >> out/.config
        
        make O=out ARCH=arm64 olddefconfig

    - name: Build
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make O=out ARCH=arm64 -j2
        ls -lh out/arch/arm64/boot/

    - name: Package
      if: success()
      run: |
        mkdir -p pkg
        cp out/arch/arm64/boot/Image.gz-dtb pkg/
        cd pkg
        zip ../kernel.zip Image.gz-dtb
        ls -lh ../*.zip

    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: "*.zip"
