name: Build Kernel - Force Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Setup
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Fix KernelSU
      run: sed -i '/kernelsu/d' drivers/Kconfig

    - name: Disable problematic drivers
      run: |
        # 直接删除有问题的驱动文件
        rm -rf techpack/audio techpack/display
        rm -rf drivers/power/supply/ti
        
        # 创建空目录避免编译错误
        mkdir -p techpack/audio techpack/display
        mkdir -p drivers/power/supply/ti
        echo "// Disabled" > drivers/power/supply/ti/Makefile
        echo "// Disabled" > techpack/audio/Makefile
        echo "// Disabled" > techpack/display/Makefile

    - name: Configure
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        mkdir -p out
        
        # 使用最小配置
        make O=out ARCH=arm64 defconfig
        
        # 启用必要功能
        echo "CONFIG_ZSTD_COMPRESS=y" >> out/.config
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> out/.config
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_SWAP=y" >> out/.config
        
        # 强制禁用问题驱动
        echo "CONFIG_SND_SOC=n" >> out/.config
        echo "CONFIG_POWER_SUPPLY=n" >> out/.config
        echo "CONFIG_DRM_MSM=n" >> out/.config
        
        make O=out ARCH=arm64 olddefconfig

    - name: Build
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
        else
          echo "❌ 编译失败"
          exit 1
        fi

    - name: Package
      if: success()
      run: |
        mkdir -p pkg
        cp out/arch/arm64/boot/Image.gz-dtb pkg/
        cd pkg
        zip ../kernel.zip Image.gz-dtb
        ls -lh ../*.zip

    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: "*.zip"
