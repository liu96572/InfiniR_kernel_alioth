name: Build Kernel - Final Attempt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Setup environment
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Fix KernelSU
      run: sed -i '/kernelsu/d' drivers/Kconfig

    - name: Build with optimizations
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # 清理并重新开始
        make mrproper
        mkdir -p out
        
        # 使用设备配置
        make O=out ARCH=arm64 alioth_defconfig
        
        # 启用核心功能
        echo "CONFIG_ZSTD_COMPRESS=y" >> out/.config
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> out/.config
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_SWAP=y" >> out/.config
        
        # 应用配置
        make O=out ARCH=arm64 olddefconfig
        
        echo "开始最终编译..."
        
        # 分阶段编译，避免内存问题
        echo "阶段1: 编译vmlinux..."
        make O=out ARCH=arm64 vmlinux -j2
        
        echo "阶段2: 编译模块..."
        make O=out ARCH=arm64 modules -j2
        
        echo "阶段3: 生成最终镜像..."
        make O=out ARCH=arm64 -j2
        
        # 检查结果
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "文件大小: $(ls -lh out/arch/arm64/boot/Image.gz-dtb | awk '{print $5}')"
        else
          echo "检查生成的文件..."
          find out/ -name "vmlinux" -o -name "Image*" | head -10
          exit 1
        fi

    - name: Create package
      if: success()
      run: |
        mkdir -p pkg
        cp out/arch/arm64/boot/Image.gz-dtb pkg/
        cd pkg
        zip ../kernel.zip Image.gz-dtb
        echo "✅ 刷机包创建完成"
        ls -lh ../*.zip

    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: final-kernel
        path: "*.zip"
