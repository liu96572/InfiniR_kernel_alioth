name: Build Kernel - Fix Kconfig

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Setup
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Fix KernelSU
      run: sed -i '/kernelsu/d' drivers/Kconfig

    - name: Fix Kconfig dependencies
      run: |
        # 修复电源管理Kconfig引用
        if [ -f "drivers/power/supply/Kconfig" ]; then
          sed -i '/ti\/Kconfig/d' drivers/power/supply/Kconfig
          echo "✅ 修复电源管理Kconfig"
        fi
        
        # 创建空的Kconfig文件避免错误
        mkdir -p drivers/power/supply/ti
        mkdir -p techpack/audio
        mkdir -p techpack/display
        
        echo "# Empty Kconfig - Disabled" > drivers/power/supply/ti/Kconfig
        echo "# Empty Kconfig - Disabled" > techpack/audio/Kconfig
        echo "# Empty Kconfig - Disabled" > techpack/display/Kconfig

    - name: Build with alioth config
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        mkdir -p out
        
        # 使用设备专用配置，而不是defconfig
        make O=out ARCH=arm64 alioth_defconfig
        
        # 在现有配置基础上禁用问题驱动
        echo "CONFIG_SND_SOC=n" >> out/.config
        echo "CONFIG_POWER_SUPPLY=n" >> out/.config
        echo "CONFIG_DRM_MSM=n" >> out/.config
        
        make O=out ARCH=arm64 olddefconfig
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
        else
          echo "❌ 编译失败"
          exit 1
        fi

    - name: Package
      if: success()
      run: |
        mkdir -p pkg
        cp out/arch/arm64/boot/Image.gz-dtb pkg/
        cd pkg
        zip ../kernel.zip Image.gz-dtb
        ls -lh ../*.zip

    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: "*.zip"
