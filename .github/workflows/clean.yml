name: Build Kernel - Exact Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Fix KernelSU dependency
      run: |
        echo "修复KernelSU依赖..."
        # 精确注释第238行
        sed -i '238s/^\(.*kernelsu.*\)$/# \1/' drivers/Kconfig
        echo "✅ KernelSU依赖已修复"

    - name: Disable problematic power drivers
      run: |
        echo "禁用问题电源驱动..."
        # 精确注释第54行
        sed -i '54s/^\(.*power/supply/ti.*\)$/# \1/' drivers/power/supply/Kconfig
        echo "✅ 电源驱动已禁用"

    - name: Setup
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        mkdir -p out
        
        echo "应用设备配置..."
        make O=out ARCH=arm64 alioth_defconfig
        
        echo "启用新功能..."
        echo "CONFIG_ZSTD_COMPRESS=y" >> out/.config
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> out/.config
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> out/.config
        echo "CONFIG_SWAP=y" >> out/.config
        
        make O=out ARCH=arm64 olddefconfig
        
        echo "配置验证:"
        echo "KernelSU状态: $(grep CONFIG_KSU out/.config || echo '未启用')"
        echo "电源驱动状态: $(grep CONFIG_BQ2597X out/.config || echo '未启用')"

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "开始编译..."
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 内核编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "编译完成时间: $(date)"
        else
          echo "❌ 编译失败"
          echo "调试信息:"
          find out/ -name "*.o" | head -5
          exit 1
        fi

    - name: Create package
      if: success()
      run: |
        mkdir -p pkg
        cp out/arch/arm64/boot/Image.gz-dtb pkg/
        cd pkg
        zip ../kernel.zip Image.gz-dtb
        ls -lh ../*.zip

    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: "*.zip"
