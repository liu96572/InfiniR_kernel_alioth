name: Build Kernel - Exact Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Fix KernelSU dependency
      run: |
        echo "修复KernelSU依赖..."
        # 注释掉KernelSU引用（精确修复）
        sed -i '238s/^source/# source/' drivers/Kconfig
        echo "✅ KernelSU依赖已修复"

    - name: Disable problematic power drivers
      run: |
        echo "禁用问题电源驱动..."
        # 注释掉TI电源驱动
        sed -i '54s/^source/# source/' drivers/power/supply/Kconfig
        echo "✅ 电源驱动已禁用"

    - name: Setup
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        mkdir -p out
        
        echo "应用设备配置..."
        make O=out ARCH=arm64 alioth_defconfig
        
        echo "启用新功能..."
        echo "CONFIG_ZSTD_COMPRESS=y" >> out/.config
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> out/.config
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> out/.config
        echo "CONFIG_SWAP=y" >> out/.config
        
        # 确保问题驱动被禁用
        echo "CONFIG_BQ2597X_CHARGER=n" >> out/.config
        echo "CONFIG_SND_SOC_SWR_MSTR_CTRL=n" >> out/.config
        
        make O=out ARCH=arm64 olddefconfig
        
        echo "配置验证:"
        grep -E "CONFIG_(BQ2597X|KSU|ZSTD)=" out/.config || true

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "开始编译..."
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 内核编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
        else
          echo "❌ 编译失败"
          exit 1
        fi

    - name: Create package
      if: success()
      run: |
        mkdir -p pkg
        cp out/arch/arm64/boot/Image.gz-dtb pkg/
        cd pkg
        zip ../kernel.zip Image.gz-dtb
        ls -lh ../*.zip

    - name: Upload
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: kernel
        path: "*.zip"
