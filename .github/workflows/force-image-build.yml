name: Build Kernel - Force Image

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Force_Image
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu device-tree-compiler

    - name: Quick fixes
      run: |
        sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# source "drivers\/kernelsu\/Kconfig"/' drivers/Kconfig 2>/dev/null || true
        sed -i '1120s/.*/\/\/ 修复浮点/' drivers/power/supply/ti/bq2597x_charger.c
        sed -i '1134s/.*/\/\/ 修复浮点/' drivers/power/supply/ti/bq2597x_charger.c

    - name: Force build complete image
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export KCFLAGS="-Wno-error"
        
        echo "强制生成完整镜像..."
        mkdir -p out
        
        # 1. 配置
        cp arch/arm64/configs/alioth_defconfig out/.config
        make O=out ARCH=arm64 olddefconfig > /dev/null 2>&1
        
        # 2. 编译vmlinux（核心内核）
        echo "编译vmlinux..."
        make O=out ARCH=arm64 vmlinux -j2
        
        # 3. 生成设备树
        echo "生成设备树..."
        make O=out ARCH=arm64 dtbs 2>/dev/null || echo "设备树生成失败，继续..."
        
        # 4. 强制生成Image
        echo "生成Image..."
        make O=out ARCH=arm64 Image 2>/dev/null || echo "Image生成失败，继续..."
        
        # 5. 强制生成压缩镜像
        echo "生成Image.gz..."
        make O=out ARCH=arm64 Image.gz 2>/dev/null || echo "Image.gz生成失败，继续..."
        
        # 6. 强制生成最终镜像
        echo "生成Image.gz-dtb..."
        make O=out ARCH=arm64 Image.gz-dtb 2>/dev/null || echo "Image.gz-dtb生成失败，继续..."
        
        # 7. 检查生成的文件
        echo "=== 最终文件检查 ==="
        echo "vmlinux: $(ls -lh out/vmlinux 2>/dev/null || echo '缺失')"
        echo "Image: $(ls -lh out/arch/arm64/boot/Image 2>/dev/null || echo '缺失')"
        echo "Image.gz: $(ls -lh out/arch/arm64/boot/Image.gz 2>/dev/null || echo '缺失')"
        echo "Image.gz-dtb: $(ls -lh out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || echo '缺失')"
        
        # 8. 如果vmlinux存在但Image不存在，手动创建
        if [ -f "out/vmlinux" ] && [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "⚠️ vmlinux存在但无最终镜像，尝试手动处理..."
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "boot目录不存在"
        fi

    - name: Create minimal package from vmlinux
      run: |
        echo "从vmlinux创建最小化刷机包..."
        mkdir -p ak3_package
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
          echo "✅ 使用标准镜像"
        elif [ -f "out/vmlinux" ]; then
          # 如果只有vmlinux，尝试直接使用
          cp out/vmlinux ak3_package/
          echo "⚠️ 使用vmlinux（可能需要手动处理）"
        else
          echo "❌ 无可用内核文件"
          echo "编译状态:"
          find out/ -name "vmlinux" -o -name "System.map" -o -name "*.dtb" 2>/dev/null | head -10
          exit 1
        fi
        
        cat > ak3_package/anykernel.sh << 'EOF'
        #!/system/bin/sh
        echo "Flashing Kernel"
        if [ -f "/tmp/anykernel/Image.gz-dtb" ]; then
          dd if=/tmp/anykernel/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot
        elif [ -f "/tmp/anykernel/vmlinux" ]; then
          echo "使用vmlinux，需要手动处理"
          dd if=/tmp/anykernel/vmlinux of=/dev/block/bootdevice/by-name/boot
        fi
        echo "Done"
        EOF
        
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        echo "✅ 刷机包创建完成"

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: force-image-kernel
        path: "*.zip"
