name: Build Kernel - Complete Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Fix KernelSU dependency permanently
      run: |
        echo "修复KernelSU依赖..."
        
        # 1. 修复drivers/Kconfig文件
        if grep -q "kernelsu" drivers/Kconfig; then
          echo "移除KernelSU引用..."
          sed -i '/source.*kernelsu/d' drivers/Kconfig
          echo "✅ drivers/Kconfig修复完成"
        fi
        
        # 2. 创建必要的KernelSU目录结构
        mkdir -p drivers/kernelsu
        echo "# KernelSU placeholder - dependencies fixed" > drivers/kernelsu/Kconfig
        echo "# KernelSU placeholder" > drivers/kernelsu/Makefile
        
        # 3. 检查.gitmodules问题
        if [ -f ".gitmodules" ] && grep -q "KernelSU-Next" .gitmodules; then
          echo "修复.gitmodules..."
          sed -i '/KernelSU-Next/d' .gitmodules
        fi

    - name: Setup
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Create working defconfig
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        mkdir -p out
        
        echo "步骤1: 使用defconfig创建基础配置..."
        make O=out ARCH=arm64 defconfig
        
        echo "步骤2: 手动设置必要功能..."
        # 直接创建最小可用的.config文件
        cat > out/.config << 'EOF'
# Automatically generated file; DO NOT EDIT.
# Linux/arm64 4.14.190 Kernel Configuration
CONFIG_ZSTD_COMPRESS=y
CONFIG_ZSTD_DECOMPRESS=y
CONFIG_ZRAM=y
CONFIG_ZRAM_DEF_COMP_ZSTD=y
CONFIG_SWAP=y
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_ARCH_QCOM=y
CONFIG_ARCH_SDM845=y
CONFIG_PCI=y
CONFIG_PCI_MSI=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_BLK_DEV_RAM=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_ATA=y
CONFIG_AHCI_QCOM=y
CONFIG_NETDEVICES=y
CONFIG_ETHERNET=y
CONFIG_NET_VENDOR_QUALCOMM=y
CONFIG_QCOM_EMAC=y
CONFIG_INPUT_EVDEV=y
CONFIG_SERIO=y
CONFIG_VT=y
CONFIG_FB=y
CONFIG_FB_MSM=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_STORAGE=y
CONFIG_MMC=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_MSM=y
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_PM8XXX=y
CONFIG_QCOM_COINCELL=y
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_PRINTK_TIME=y
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_KERNEL=y
EOF
        
        echo "步骤3: 应用配置..."
        yes "" | make O=out ARCH=arm64 oldconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "开始编译内核..."
        make O=out ARCH=arm64 -j2
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 内核编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "编译完成时间: $(date)"
        else
          echo "❌ 编译失败"
          echo "检查输出目录:"
          find out/ -name "*.o" | head -5
          exit 1
        fi

    - name: Create package
      if: success()
      run: |
        echo "创建刷机包..."
        mkdir -p ak3_package
        cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
        
        # 创建最小化刷机脚本
        echo '#!/sbin/sh' > ak3_package/anykernel.sh
        echo 'echo "Flashing InfiniR Kernel..."' >> ak3_package/anykernel.sh
        echo 'dd if=/tmp/anykernel/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot' >> ak3_package/anykernel.sh
        echo 'echo "Flash complete!"' >> ak3_package/anykernel.sh
        chmod +x ak3_package/anykernel.sh
        
        cd ak3_package
        zip -r9 ../InfiniR_Kernel.zip .
        cd ..
        
        echo "✅ 刷机包创建完成"
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: complete-kernel
        path: "*.zip"
