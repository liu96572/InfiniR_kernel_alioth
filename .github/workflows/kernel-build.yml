name: Build Kernel - Simple & Reliable

on:
  push:
    branches: [ 16.0-alioth ]
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Simple
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev git wget

    - name: Setup AOSP Clang (更稳定的选择)
      run: |
        mkdir -p toolchains
        echo "下载AOSP Clang工具链..."
        
        # 使用Google官方AOSP Clang，更稳定
        wget -q --timeout=60 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz -O clang.tar.gz
        
        if [ $? -eq 0 ] && [ -f "clang.tar.gz" ]; then
          echo "解压工具链..."
          tar -xzf clang.tar.gz -C toolchains/
          rm clang.tar.gz
          echo "✅ AOSP Clang工具链准备完成"
        else
          echo "❌ AOSP Clang下载失败，尝试备用方案..."
          # 备用方案：使用系统Clang
          sudo apt-get install -y clang lld
          echo "使用系统Clang继续编译"
        fi

    - name: Configure kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # 设置工具链路径
        if [ -d "toolchains/bin" ]; then
          export PATH=$(pwd)/toolchains/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          echo "使用AOSP Clang工具链"
        else
          export CC=clang
          export LD=ld.lld
          export CROSS_COMPILE=aarch64-linux-gnu-
          echo "使用系统Clang工具链"
        fi
        
        echo "创建输出目录..."
        mkdir -p out
        
        echo "应用默认配置..."
        make O=out ARCH=arm64 alioth_defconfig

    - name: Enable essential features
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        if [ -d "toolchains/bin" ]; then
          export PATH=$(pwd)/toolchains/bin:$PATH
        else
          export CC=clang
          export LD=ld.lld
        fi
        
        echo "启用核心功能..."
        
        # 直接修改.config文件
        echo "CONFIG_ZSTD_COMPRESS=y" >> out/.config
        echo "CONFIG_ZSTD_DECOMPRESS=y" >> out/.config  
        echo "CONFIG_KERNEL_ZSTD=y" >> out/.config
        echo "CONFIG_ZRAM=y" >> out/.config
        echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> out/.config
        
        echo "CONFIG_SWAP=y" >> out/.config
        echo "CONFIG_CGROUP_FREEZER=y" >> out/.config
        
        echo "应用配置..."
        make O=out ARCH=arm64 olddefconfig
        echo "✅ 内核配置完成"

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        if [ -d "toolchains/bin" ]; then
          export PATH=$(pwd)/toolchains/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
        else
          export CC=clang
          export LD=ld.lld
          export CROSS_COMPILE=aarch64-linux-gnu-
        fi
        
        echo "开始编译内核..."
        echo "使用编译器:"
        ${CROSS_COMPILE}gcc --version | head -1 || clang --version | head -1
        
        # 简单编译，不使用复杂参数
        make O=out ARCH=arm64 -j$(nproc)
        
        # 检查编译结果
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✅ 内核编译成功！"
          echo "文件信息:"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "编译完成时间: $(date)"
        else
          echo "❌ 内核编译失败"
          echo "输出目录内容:"
          find out/ -type f -name "*.o" | head -10 || echo "无目标文件"
          exit 1
        fi

    - name: Create flashable zip
      if: success()
      run: |
        echo "创建刷机包..."
        
        # 手动创建最小化AnyKernel3结构
        mkdir -p ak3_package/META-INF/com/google/android
        mkdir -p ak3_package/tools
        
        cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
        
        # 创建简单的刷机脚本
        cat > ak3_package/META-INF/com/google/android/update-binary << 'EOF'
        #!/sbin/sh
        echo "InfiniR Kernel Flasher"
        echo "Mounting partitions..."
        mount /system 2>/dev/null
        mount /vendor 2>/dev/null
        
        echo "Extracting kernel..."
        cd /tmp
        unzip -o "$3" Image.gz-dtb
        
        echo "Flashing kernel..."
        dd if=/tmp/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot
        
        echo "Cleaning up..."
        umount /system 2>/dev/null
        umount /vendor 2>/dev/null
        echo "Flash complete!"
        EOF
        
        cat > ak3_package/META-INF/com/google/android/updater-script << 'EOF'
        ui_print("InfiniR Simple Kernel");
        ui_print("Device: alioth");
        ui_print("Flashing kernel...");
        show_progress(0.500000, 0);
        package_extract_file("Image.gz-dtb", "/tmp/Image.gz-dtb");
        run_program("/sbin/dd", "if=/tmp/Image.gz-dtb", "of=/dev/block/bootdevice/by-name/boot");
        show_progress(0.100000, 0);
        ui_print("Flash complete!");
        EOF
        
        chmod +x ak3_package/META-INF/com/google/android/update-binary
        
        # 创建ZIP包
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}_simple.zip" .
        cd ..
        
        echo "✅ 刷机包创建完成"
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: simple-kernel
        path: "*.zip"
        retention-days: 7
