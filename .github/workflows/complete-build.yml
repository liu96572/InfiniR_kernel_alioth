name: Build Kernel - Final Image Fix

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Complete
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu device-tree-compiler

    - name: Fix KernelSU reference
      run: |
        sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# source "drivers\/kernelsu\/Kconfig"/' drivers/Kconfig 2>/dev/null || true

    - name: Fix bq2597x source
      run: |
        echo "修复bq2597x浮点问题..."
        sed -i '1120s/.*result = t;/\/\/ *result = t; \/\/* 注释浮点运算/' drivers/power/supply/ti/bq2597x_charger.c
        sed -i '1134s/.*result = (int)(t \* sc8551_adc_lsb\[channel\]);/\/\/ *result = (int)(t * sc8551_adc_lsb[channel]); \/\/* 注释浮点运算/' drivers/power/supply/ti/bq2597x_charger.c
        sed -i '1134a\                        *result = 0; \/\/ 临时返回值' drivers/power/supply/ti/bq2597x_charger.c

    - name: Build step by step
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "分步骤编译确保成功..."
        mkdir -p out
        
        # 使用现有配置
        cp arch/arm64/configs/alioth_defconfig out/.config
        
        echo "应用配置..."
        make O=out ARCH=arm64 olddefconfig > /dev/null 2>&1
        
        echo "步骤1: 编译vmlinux..."
        make O=out ARCH=arm64 -j2 vmlinux
        
        echo "步骤2: 编译设备树..."
        make O=out ARCH=arm64 dtbs
        
        echo "步骤3: 生成Image..."
        make O=out ARCH=arm64 Image
        
        echo "步骤4: 生成压缩镜像..."
        make O=out ARCH=arm64 Image.gz
        
        echo "步骤5: 生成最终镜像..."
        make O=out ARCH=arm64 Image.gz-dtb
        
        echo "检查所有生成的文件..."
        echo "=== 内核镜像 ==="
        find out/arch/arm64/boot/ -name "Image*" -type f 2>/dev/null
        echo "=== 设备树 ==="
        find out/ -name "*.dtb" -type f 2>/dev/null | head -5
        echo "=== 核心文件 ==="
        [ -f "out/vmlinux" ] && echo "✅ vmlinux存在" || echo "❌ vmlinux缺失"

    - name: Create package from any image
      run: |
        echo "使用任何可用的镜像创建刷机包..."
        
        # 检查各种可能的镜像文件
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb"
          echo "✅ 使用 Image.gz-dtb"
        elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
          KERNEL_IMAGE="out/arch/arm64/boot/Image.gz"
          echo "✅ 使用 Image.gz"
        elif [ -f "out/arch/arm64/boot/Image" ]; then
          KERNEL_IMAGE="out/arch/arm64/boot/Image"
          echo "✅ 使用 Image"
        elif [ -f "out/vmlinux" ]; then
          KERNEL_IMAGE="out/vmlinux"
          echo "⚠️ 使用 vmlinux (需要手动处理)"
        else
          echo "❌ 没有找到可用的内核镜像"
          exit 1
        fi
        
        mkdir -p ak3_package
        cp "$KERNEL_IMAGE" ak3_package/
        
        cat > ak3_package/anykernel.sh << 'EOF'
        #!/system/bin/sh
        echo "Flashing InfiniR Kernel..."
        echo "Built with GitHub Actions"
        dd if=/tmp/anykernel/$(basename "$KERNEL_IMAGE") of=/dev/block/bootdevice/by-name/boot
        echo "Flash complete! Reboot to apply."
        EOF
        
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        
        echo "✅ 刷机包创建完成"
        ls -lh *.zip

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: complete-kernel
        path: |
          *.zip
          out/arch/arm64/boot/Image* 2>/dev/null || echo "无镜像文件"
        if-no-files-found: warn
