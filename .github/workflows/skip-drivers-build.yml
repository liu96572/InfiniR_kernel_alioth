name: Build Kernel - Skip Problematic Drivers

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Skip_Drivers
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu

    - name: Disable problematic drivers
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "禁用所有可能导致问题的驱动..."
        mkdir -p out
        
        # 使用配置
        cp arch/arm64/configs/alioth_defconfig out/.config
        
        # 禁用已知问题驱动
        echo "# CONFIG_BQ2597X_CHARGE_PUMP is not set" >> out/.config
        echo "# CONFIG_BQ2597X_CHARGE_PUMP_STANDALONE is not set" >> out/.config
        echo "# CONFIG_BQ2597X_CHARGE_PUMP_STANDALONE_MUNCH is not set" >> out/.config
        echo "# CONFIG_BQ_PUMP_WIRELESS_CHARGE is not set" >> out/.config
        echo "# CONFIG_DUAL_BQ2597X is not set" >> out/.config
        echo "# CONFIG_CHARGER_LN8000 is not set" >> out/.config
        echo "# CONFIG_CHARGER_LN8000_PSYCHE is not set" >> out/.config
        
        # 禁用其他可能问题驱动
        echo "# CONFIG_SENSORS_QPNP_ADC_VOLTAGE is not set" >> out/.config
        echo "# CONFIG_QPNP_SMB5 is not set" >> out/.config
        echo "# CONFIG_QPNP_FG_GEN4 is not set" >> out/.config
        
        echo "应用配置..."
        make O=out ARCH=arm64 olddefconfig > /dev/null 2>&1
        
        echo "验证禁用状态:"
        grep -E "BQ2597|LN8000|SMB5|FG_GEN4" out/.config || echo "✅ 问题驱动已禁用"

    - name: Build minimal kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export KCFLAGS="-Wno-error -Wno-format -Wno-array-bounds"
        
        echo "编译最小化内核..."
        
        # 只编译核心内核，跳过有问题的驱动
        echo "生成vmlinux..."
        make O=out ARCH=arm64 vmlinux -j2
        
        echo "生成基础镜像..."
        make O=out ARCH=arm64 Image -j2
        
        echo "生成压缩镜像..."
        make O=out ARCH=arm64 Image.gz -j2
        
        echo "检查结果:"
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "🎉 基础内核编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz
          echo "可以手动添加设备树生成完整镜像"
        elif [ -f "out/arch/arm64/boot/Image" ]; then
          echo "⚠️ 未压缩镜像成功"
          ls -lh out/arch/arm64/boot/Image
        elif [ -f "out/vmlinux" ]; then
          echo "⚠️ 只有vmlinux成功"
          ls -lh out/vmlinux
        else
          echo "❌ 编译完全失败"
        fi

    - name: Create basic package
      if: success()
      run: |
        echo "创建基础刷机包..."
        mkdir -p ak3_package
        
        if [ -f "out/arch/arm64/boot/Image.gz" ]; then
          cp out/arch/arm64/boot/Image.gz ak3_package/
          echo "✅ 使用Image.gz"
        elif [ -f "out/arch/arm64/boot/Image" ]; then
          cp out/arch/arm64/boot/Image ak3_package/
          echo "✅ 使用Image"
        else
          echo "❌ 无可用镜像"
          exit 1
        fi
        
        cat > ak3_package/anykernel.sh << 'EOF'
        #!/system/bin/sh
        echo "Flashing Minimal Kernel"
        echo "Problematic drivers disabled"
        dd if=/tmp/anykernel/Image.gz of=/dev/block/bootdevice/by-name/boot
        echo "Flash complete! May need manual DTB."
        EOF
        
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        
        echo "✅ 基础刷机包完成"
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: skip-drivers-kernel
        path: "*.zip"
