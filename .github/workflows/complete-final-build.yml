name: Build Kernel - Complete Final

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Complete
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu device-tree-compiler

    - name: Fix KernelSU reference
      run: |
        sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# source "drivers\/kernelsu\/Kconfig"/' drivers/Kconfig 2>/dev/null || true

    - name: Fix bq2597x source
      run: |
        echo "修复bq2597x浮点问题..."
        # 注释掉有问题的浮点运算
        sed -i '1120s/.*/\/\/ *result = t; \/\/* 注释浮点运算/' drivers/power/supply/ti/bq2597x_charger.c
        sed -i '1134s/.*/\/\/ *result = (int)(t * sc8551_adc_lsb[channel]); \/\/* 注释浮点运算/' drivers/power/supply/ti/bq2597x_charger.c

    - name: Build complete kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo "开始完整编译..."
        mkdir -p out
        
        # 使用现有配置
        cp arch/arm64/configs/alioth_defconfig out/.config
        
        # 应用配置
        make O=out ARCH=arm64 olddefconfig > /dev/null 2>&1
        
        echo "步骤1: 编译核心内核..."
        make O=out ARCH=arm64 -j2
        
        echo "步骤2: 生成最终镜像..."
        # 直接生成最终的Image.gz-dtb
        make O=out ARCH=arm64 Image.gz-dtb
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "🎉 内核编译成功！"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          echo "文件大小: $(stat -c%s out/arch/arm64/boot/Image.gz-dtb) 字节"
        else
          echo "检查生成的文件..."
          echo "=== 所有Image文件 ==="
          find out/arch/arm64/boot/ -name "Image*" -type f 2>/dev/null
          echo "=== 设备树文件 ==="
          find out/ -name "*.dtb" -type f 2>/dev/null | head -5
          echo "=== 核心文件 ==="
          [ -f "out/vmlinux" ] && echo "✅ vmlinux存在" || echo "❌ vmlinux缺失"
        fi

    - name: Create flashable package
      if: success()
      run: |
        echo "创建刷机包..."
        mkdir -p ak3_package
        
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
          echo "✅ 使用Image.gz-dtb"
        elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
          cp out/arch/arm64/boot/Image.gz ak3_package/
          echo "✅ 使用Image.gz"
        elif [ -f "out/arch/arm64/boot/Image" ]; then
          cp out/arch/arm64/boot/Image ak3_package/
          echo "✅ 使用Image"
        else
          echo "❌ 找不到内核镜像文件"
          exit 1
        fi
        
        cat > ak3_package/anykernel.sh << 'EOF'
        #!/system/bin/sh
        echo "Flashing InfiniR Complete Kernel..."
        echo "Built with GitHub Actions"
        dd if=/tmp/anykernel/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot
        echo "Flash complete! Reboot to apply."
        EOF
        
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        
        echo "✅ 刷机包创建完成"
        ls -lh *.zip

    - name: Upload kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: complete-kernel
        path: "*.zip"
        retention-days: 30
