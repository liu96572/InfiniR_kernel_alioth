name: Build Kernel - Complete Flow

on:
  workflow_dispatch:

env:
  KERNEL_NAME: InfiniR_Complete
  DEVICE: alioth

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 16.0-alioth

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev bc flex bison libelf-dev gcc-aarch64-linux-gnu device-tree-compiler

    - name: Quick fixes
      run: |
        sed -i 's/^source "drivers\/kernelsu\/Kconfig"/# source "drivers\/kernelsu\/Kconfig"/' drivers/Kconfig 2>/dev/null || true
        sed -i '1120s/.*/\/\/ 修复浮点/' drivers/power/supply/ti/bq2597x_charger.c
        sed -i '1134s/.*/\/\/ 修复浮点/' drivers/power/supply/ti/bq2597x_charger.c

    - name: Complete build process
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export KCFLAGS="-Wno-error"
        
        echo "完整编译流程..."
        mkdir -p out
        
        # 1. 配置
        echo "步骤1: 配置内核..."
        cp arch/arm64/configs/alioth_defconfig out/.config
        make O=out ARCH=arm64 olddefconfig > /dev/null 2>&1
        
        # 2. 编译核心
        echo "步骤2: 编译核心内核..."
        make O=out ARCH=arm64 -j2 2>&1 | grep -E "error:|Error:|停止" | head -20 || true
        
        # 3. 生成最终镜像
        echo "步骤3: 生成最终镜像..."
        make O=out ARCH=arm64 Image.gz-dtb 2>&1 | tail -20
        
        # 4. 检查所有生成的文件
        echo "=== 生成文件检查 ==="
        echo "Image.gz-dtb: $(ls out/arch/arm64/boot/Image.gz-dtb 2>/dev/null || echo '不存在')"
        echo "Image.gz: $(ls out/arch/arm64/boot/Image.gz 2>/dev/null || echo '不存在')" 
        echo "Image: $(ls out/arch/arm64/boot/Image 2>/dev/null || echo '不存在')"
        echo "vmlinux: $(ls out/vmlinux 2>/dev/null || echo '不存在')"
        
        # 5. 列出所有可能的镜像文件
        echo "=== 所有内核文件 ==="
        find out/arch/arm64/boot/ -type f 2>/dev/null || echo "无文件"

    - name: Create package from any available image
      run: |
        echo "尝试创建刷机包..."
        mkdir -p ak3_package
        
        # 按优先级选择镜像文件
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          cp out/arch/arm64/boot/Image.gz-dtb ak3_package/
          echo "✅ 使用 Image.gz-dtb"
        elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
          cp out/arch/arm64/boot/Image.gz ak3_package/
          echo "✅ 使用 Image.gz"
        elif [ -f "out/arch/arm64/boot/Image" ]; then
          cp out/arch/arm64/boot/Image ak3_package/
          echo "✅ 使用 Image"
        else
          echo "❌ 找不到任何内核镜像"
          echo "可用的文件:"
          find out/ -name "*.o" -o -name "vmlinux" -o -name "*.ko" 2>/dev/null | head -10
          exit 1
        fi
        
        cat > ak3_package/anykernel.sh << 'EOF'
        #!/system/bin/sh
        echo "Flashing Kernel"
        dd if=/tmp/anykernel/Image.gz-dtb of=/dev/block/bootdevice/by-name/boot
        echo "Done"
        EOF
        
        cd ak3_package
        zip -r9 "../${KERNEL_NAME}.zip" .
        cd ..
        echo "✅ 刷机包创建完成"

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: complete-kernel
        path: "*.zip"
